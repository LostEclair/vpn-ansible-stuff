---

- name: Deploy ssh_banner
  become: yes
  ansible.builtin.copy:
    src: ssh_banner
    dest: /etc/ssh/banner
    owner: root
    group: root
    mode: "0644"

- name: Deploy sshd_config file
  become: yes
  ansible.builtin.copy:
    src: sshd_config
    dest: /etc/ssh/sshd_config
    owner: root
    group: root
    mode: "0600"
    validate: sshd -T -f %s
  notify: Restart SSHD
